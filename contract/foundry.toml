[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "account-abstraction/=lib/account-abstraction/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Arc Testnet (Circle) — chain id 5042002, USDC-native gas
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"

[etherscan]
# Arc testnet explorer verification support — placeholder, confirm endpoint before use
arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "https://testnet.arcscan.app/api" }
